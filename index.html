<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MRV – Torre de Controle Aéreo</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --mrv-green: #0f6e36;
    --mrv-light-green: #00b050;
    --mrv-orange: #f0a500;
    --mrv-yellow: #ffe066;
    --bg-dark: #060d18;
    --bg-mid: #0d1f35;
    --bg-card: #0f2540;
    --text-primary: #e8f4ff;
    --text-muted: #5a8aaa;
  }

  html, body {
    width: 100%; min-height: 100vh;
    background: var(--bg-dark);
    color: var(--text-primary);
    font-family: 'Barlow', sans-serif;
    overflow-x: hidden;
  }

  /* ── STARS BACKGROUND ── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,0.7) 0%, transparent 100%),
      radial-gradient(1px 1px at 25% 60%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 40% 25%, rgba(255,255,255,0.8) 0%, transparent 100%),
      radial-gradient(1px 1px at 55% 75%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 40%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 80% 20%, rgba(255,255,255,0.7) 0%, transparent 100%),
      radial-gradient(1px 1px at 90% 65%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 15% 85%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 60% 10%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 35% 90%, rgba(255,255,255,0.3) 0%, transparent 100%);
    pointer-events: none; z-index: 0;
  }

  /* ── HEADER ── */
  header {
    position: relative; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 40px;
    border-bottom: 1px solid rgba(0,176,80,0.2);
    background: rgba(6,13,24,0.85);
    backdrop-filter: blur(10px);
    flex-wrap: wrap; gap: 12px;
  }
  header img { height: 40px; }
  .header-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(14px, 2vw, 18px);
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  .header-badge {
    background: rgba(0,176,80,0.12);
    border: 1px solid rgba(0,176,80,0.3);
    color: var(--mrv-light-green);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 1px;
  }

  /* ── MAIN ── */
  main {
    position: relative; z-index: 2;
    display: flex; flex-direction: column; align-items: center;
    padding: 30px 20px 60px;
    gap: 24px;
  }

  /* ── PHASE DISPLAY ── */
  #phase-display {
    text-align: center;
    min-height: 60px;
  }
  #phase-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(22px, 5vw, 38px);
    font-weight: 900;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--text-primary);
    transition: opacity 0.4s;
  }
  #phase-spec {
    font-size: clamp(11px, 2vw, 14px);
    color: var(--text-muted);
    letter-spacing: 2px;
    margin-top: 4px;
    min-height: 20px;
    transition: opacity 0.4s;
  }

  /* ── TOWER STAGE ── */
  #stage {
    position: relative;
    width: 100%;
    max-width: 500px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    min-height: 520px;
  }

  /* SKY GLOW */
  #sky-glow {
    position: absolute;
    bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 320px; height: 120px;
    background: radial-gradient(ellipse at center bottom, rgba(0,176,80,0.12), transparent 70%);
    pointer-events: none;
  }

  #tower-wrap {
    position: relative;
    display: flex; flex-direction: column; align-items: center;
  }

  /* ── ANTENNA ── */
  #ant-wrap {
    display: flex; flex-direction: column; align-items: center;
    position: relative;
  }
  #ant-ball {
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--mrv-yellow);
    box-shadow: 0 0 12px var(--mrv-yellow), 0 0 24px rgba(255,224,102,0.4);
    opacity: 0;
    transform: scale(0);
    transition: opacity 0.5s, transform 0.5s;
    margin-bottom: 2px;
  }
  #ant-shaft {
    width: 6px;
    background: linear-gradient(to top, var(--mrv-orange), var(--mrv-yellow));
    border-radius: 3px 3px 0 0;
    height: 0;
    transition: height 0.8s cubic-bezier(0.34,1.56,0.64,1);
  }

  /* ── LEGO SECTIONS ── */
  .lego-section {
    overflow: hidden;
    height: 0;
    transition: height 0.7s cubic-bezier(0.34,1.4,0.64,1);
    position: relative;
    display: flex; flex-direction: column-reverse;
  }
  #sec-tower-top { width: min(220px, 66vw); }
  #sec-central    { width: min(180px, 54vw); }
  #sec-base2      { width: min(200px, 60vw); }
  #sec-base1      { width: min(240px, 72vw); }

  .brick-row {
    display: flex; width: 100%;
  }
  .brick {
    flex: 1; height: 16px;
    margin: 1px;
    border-radius: 3px;
    position: relative;
    opacity: 0;
    transform: translateY(-20px) scale(0.8);
    transition: opacity 0.25s, transform 0.25s;
  }
  .brick::before {
    content: '';
    position: absolute;
    top: 3px; left: 6px;
    width: calc(100% - 18px); height: 5px;
    background: rgba(255,255,255,0.22);
    border-radius: 50%;
  }
  .brick::after {
    content: '';
    position: absolute; inset: 0;
    border-top: 2px solid rgba(255,255,255,0.18);
    border-radius: 3px;
  }
  /* stud row */
  .stud-strip {
    display: flex; width: 100%;
    height: 6px; padding: 0 3px;
    justify-content: space-around;
    position: absolute; top: -5px;
  }
  .stud {
    width: 11px; height: 6px;
    border-radius: 2px 2px 0 0;
    opacity: 0.65;
  }

  /* ── WINDOWS ── */
  .window-row {
    display: flex; justify-content: space-around;
    padding: 5px 10px;
    position: absolute; bottom: 3px; width: 100%;
  }
  .win {
    width: 22px; height: 16px;
    background: #b3e6ff;
    border: 2px solid #1a4a7a;
    border-radius: 3px 3px 0 0;
    box-shadow: 0 0 8px rgba(100,200,255,0.5);
    opacity: 0;
    transition: opacity 0.5s;
  }
  .win.glow { opacity: 1; animation: winPulse 2.5s ease-in-out infinite; }
  @keyframes winPulse {
    0%,100% { box-shadow: 0 0 6px rgba(100,200,255,0.4); }
    50% { box-shadow: 0 0 14px rgba(100,200,255,0.8); }
  }
  /* central big window */
  #big-win {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%,-50%);
    width: 56px; height: 38px;
    background: #b3e6ff;
    border: 3px solid #1a4a7a;
    border-radius: 4px 4px 0 0;
    box-shadow: 0 0 14px rgba(100,200,255,0.6);
    opacity: 0;
    transition: opacity 0.5s 0.3s;
  }
  #big-win.glow { opacity: 1; animation: winPulse 2.5s ease-in-out 0.5s infinite; }

  /* ── MRV FACADE LOGO ── */
  #mrv-facade {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%,-50%) scale(0) rotate(-10deg);
    width: 86px;
    transition: transform 0.7s cubic-bezier(0.34,1.6,0.64,1);
    pointer-events: none;
    z-index: 5;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5));
  }
  #mrv-facade.show {
    transform: translate(-50%,-50%) scale(1) rotate(0deg);
  }

  /* ── SECTION DIVIDERS ── */
  .sec-border {
    width: 100%; height: 2px;
    background: linear-gradient(to right, transparent, rgba(0,176,80,0.4), transparent);
  }

  /* ── GROUND ── */
  #ground {
    width: min(300px, 90vw);
    height: 12px;
    background: linear-gradient(to bottom, #1a3a50, #0a1e2c);
    border-radius: 0 0 8px 8px;
    border: 1.5px solid #2a5070;
    border-top: none;
  }
  #ground-glow {
    width: min(260px,78vw); height: 20px;
    background: radial-gradient(ellipse, rgba(0,176,80,0.15), transparent 70%);
    margin-top: 4px;
  }

  /* ── PROGRESS ── */
  #progress-wrap {
    width: 100%; max-width: 400px;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .progress-track {
    width: 100%; height: 4px;
    background: rgba(255,255,255,0.06);
    border-radius: 4px;
    overflow: hidden;
  }
  #prog-fill {
    height: 100%;
    background: linear-gradient(to right, var(--mrv-green), var(--mrv-light-green), var(--mrv-orange));
    border-radius: 4px;
    width: 0%;
    transition: width 0.6s ease;
  }
  #prog-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    letter-spacing: 2px;
    color: var(--text-muted);
    text-transform: uppercase;
    text-align: center;
  }
  #prog-pct {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    color: var(--mrv-light-green);
    letter-spacing: 1px;
  }

  /* ── SPECS PANEL ── */
  #specs {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 10px;
    width: 100%; max-width: 480px;
  }
  .spec-card {
    background: rgba(15,37,64,0.7);
    border: 1px solid rgba(0,176,80,0.15);
    border-radius: 8px;
    padding: 12px 14px;
    display: flex; flex-direction: column; gap: 4px;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.5s, transform 0.5s, border-color 0.4s;
  }
  .spec-card.active {
    opacity: 1; transform: translateY(0);
    border-color: rgba(0,176,80,0.45);
  }
  .spec-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 10px; letter-spacing: 2px;
    color: var(--text-muted); text-transform: uppercase;
  }
  .spec-val {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px; font-weight: 700;
    color: var(--mrv-light-green);
  }
  .spec-desc { font-size: 11px; color: rgba(180,210,240,0.6); }

  /* ── CONFETTI ── */
  .confetti-piece {
    position: fixed;
    width: 10px; height: 10px;
    border-radius: 2px;
    pointer-events: none; z-index: 999;
    animation: confettiFall var(--dur) ease-in var(--delay) forwards;
  }
  @keyframes confettiFall {
    0% { transform: translate(0,0) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--dx), 100vh) rotate(var(--rot)); opacity: 0; }
  }

  /* ── CONGRATS ── */
  #congrats-banner {
    text-align: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.7s;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  #congrats-banner.show { opacity: 1; pointer-events: auto; }
  #congrats-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(20px,5vw,32px);
    font-weight: 900;
    letter-spacing: 3px;
    color: var(--mrv-light-green);
    text-transform: uppercase;
  }
  #congrats-sub {
    font-size: 13px; color: var(--text-muted); letter-spacing: 1px;
  }

  #restart-btn {
    margin-top: 4px;
    padding: 11px 34px;
    background: transparent;
    border: 1.5px solid var(--mrv-light-green);
    color: var(--mrv-light-green);
    border-radius: 4px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 15px; letter-spacing: 3px; text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  #restart-btn:hover { background: var(--mrv-light-green); color: #fff; }

  /* ── FLOATING BRICKS ── */
  .fly-brick {
    position: fixed;
    border-radius: 3px;
    pointer-events: none; z-index: 50;
    animation: flyIn 0.7s cubic-bezier(0.2,1.4,0.6,1) forwards;
  }
  @keyframes flyIn {
    from { transform: translate(var(--fx),var(--fy)) rotate(var(--fr)) scale(1.5); opacity: 1; }
    to   { transform: translate(0,0) rotate(0deg) scale(1); opacity: 0; }
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 420px) {
    header { padding: 14px 16px; }
    header img { height: 30px; }
  }
</style>
</head>

      <div class="sec-border"></div>

      <!-- BASE 2 -->
      <div class="lego-section" id="sec-base2">
        <div id="bricks-base2" class="bricks-container"></div>
      </div>

      <div class="sec-border"></div>

      <!-- BASE 1 -->
      <div class="lego-section" id="sec-base1">
        <div id="bricks-base1" class="bricks-container"></div>
      </div>

    </div><!-- tower-wrap -->

    <div id="ground"></div>
    <div id="ground-glow"></div>
  </div><!-- stage -->

  <div id="progress-wrap">
    <div class="progress-track"><div id="prog-fill"></div></div>
    <div style="display:flex;justify-content:space-between;width:100%">
      <div id="prog-label">Aguardando início...</div>
      <div id="prog-pct">0%</div>
    </div>
  </div>

  <!-- SPECS -->
  <div id="specs">
    <div class="spec-card" id="sp-base1">
      <span class="spec-label">Base 1</span>
      <span class="spec-val">12×12cm</span>
      <span class="spec-desc">Altura: 1cm</span>
    </div>
    <div class="spec-card" id="sp-base2">
      <span class="spec-label">Base 2</span>
      <span class="spec-val">10×10cm</span>
      <span class="spec-desc">Altura: 1cm</span>
    </div>
    <div class="spec-card" id="sp-central">
      <span class="spec-label">Central</span>
      <span class="spec-val">9×9cm</span>
      <span class="spec-desc">Altura: 6cm</span>
    </div>
    <div class="spec-card" id="sp-top">
      <span class="spec-label">Topo</span>
      <span class="spec-val">11×11cm</span>
      <span class="spec-desc">Janelas + Antena</span>
    </div>
  </div>

  <div id="congrats-banner">
    <div id="congrats-title">Torre Concluída!</div>
    <div id="congrats-sub">Altura mínima de 20cm atingida · Boa construção, time MRV!</div>
    <button id="restart-btn" onclick="startAnim()">↺ Reconstruir</button>
  </div>
</main>

<script>
const COLORS = [
  '#e63946','#f4a261','#2a9d8f','#e9c46a','#457b9d',
  '#f77f00','#00b4d8','#c77dff','#90be6d','#ff6b6b',
  '#ffd166','#06d6a0','#ef476f','#b5838d','#ffb703',
  '#219ebc','#fb8500','#8ecae6','#023047','#a8dadc'
];
function rc(){ return COLORS[Math.floor(Math.random()*COLORS.length)]; }
function lighter(h){
  let r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);
  return 'rgb('+Math.min(255,r+50)+','+Math.min(255,g+50)+','+Math.min(255,b+50)+')';
}

function makeBricks(id, rows, cols){
  const c=document.getElementById(id); c.innerHTML='';
  for(let r=0;r<rows;r++){
    const row=document.createElement('div'); row.className='brick-row';
    const off=r%2===1?8:0;
    for(let b=0;b<cols;b++){
      const br=document.createElement('div'); br.className='brick';
      const col=rc();
      br.style.background='linear-gradient(to bottom,'+lighter(col)+','+col+')';
      if(b===0) br.style.marginLeft=off+'px';
      row.appendChild(br);
    }
    c.appendChild(row);
  }
}

function revealBricks(id, delayStart){
  const bricks=document.querySelectorAll('#'+id+' .brick');
  bricks.forEach((br,i)=>{
    setTimeout(()=>{
      br.style.opacity='1';
      br.style.transform='translateY(0) scale(1)';
      if(Math.random()>0.6) spawnFly();
    }, delayStart + i*18);
  });
}

function spawnFly(){
  const fb=document.createElement('div'); fb.className='fly-brick';
  const col=rc();
  const sx=Math.random()*window.innerWidth, sy=Math.random()*window.innerHeight*0.6;
  const tx=(Math.random()-0.5)*160, ty=(Math.random()-0.5)*100;
  fb.style.cssText='width:16px;height:10px;background:'+col+
    ';top:'+sy+'px;left:'+sx+'px;--fx:'+tx+'px;--fy:'+ty+'px;--fr:'+((Math.random()-0.5)*80)+'deg;';
  document.body.appendChild(fb);
  setTimeout(()=>fb.remove(), 800);
}

function setPhase(name, spec, pct, label){
  document.getElementById('phase-name').textContent=name;
  document.getElementById('phase-spec').textContent=spec;
  document.getElementById('prog-fill').style.width=pct+'%';
  document.getElementById('prog-label').textContent=label;
  document.getElementById('prog-pct').textContent=pct+'%';
}

let timers=[];
function T(fn,ms){ timers.push(setTimeout(fn,ms)); }
function clearAll(){ timers.forEach(clearTimeout); timers=[]; }

function spawnConfetti(){
  for(let i=0;i<40;i++){
    const p=document.createElement('div'); p.className='confetti-piece';
    const col=COLORS[Math.floor(Math.random()*COLORS.length)];
    const dur=(1.5+Math.random()*2).toFixed(2)+'s';
    const delay=(Math.random()*0.8).toFixed(2)+'s';
    const dx=((Math.random()-0.5)*300).toFixed(0)+'px';
    const rot=((Math.random()-0.5)*720).toFixed(0)+'deg';
    p.style.cssText='background:'+col+';left:'+(Math.random()*100)+'vw;top:-20px;--dur:'+dur+';--delay:'+delay+';--dx:'+dx+';--rot:'+rot+';';
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),(parseFloat(dur)+parseFloat(delay))*1000+200);
  }
}

function startAnim(){
  clearAll();
  document.getElementById('congrats-banner').classList.remove('show');
  document.getElementById('restart-btn').style.display='none';
  ['sp-base1','sp-base2','sp-central','sp-top'].forEach(id=>document.getElementById(id).classList.remove('active'));
  ['sec-tower-top','sec-central','sec-base2','sec-base1'].forEach(id=>document.getElementById(id).style.height='0');
  document.getElementById('ant-shaft').style.height='0';
  document.getElementById('ant-ball').style.opacity='0';
  document.getElementById('ant-ball').style.transform='scale(0)';
  document.querySelectorAll('.win').forEach(w=>w.classList.remove('glow'));
  document.getElementById('big-win').classList.remove('glow');
  document.getElementById('mrv-facade').classList.remove('show');
  setPhase('Separando peças','Organize as peças antes de começar',0,'Aguardando início...');

  makeBricks('bricks-base1',4,7);
  makeBricks('bricks-base2',4,6);
  makeBricks('bricks-central',12,5);
  makeBricks('bricks-top',4,6);

  T(()=>{
    setPhase('Base 1','12×12 cm · Altura 1cm',12,'Construindo Base 1...');
    document.getElementById('sec-base1').style.height='68px';
    document.getElementById('sp-base1').classList.add('active');
    T(()=>revealBricks('bricks-base1',0), 300);
  }, 900);

  T(()=>{
    setPhase('Base 2','10×10 cm · Altura 1cm',28,'Construindo Base 2...');
    document.getElementById('sec-base2').style.height='68px';
    document.getElementById('sp-base2').classList.add('active');
    T(()=>revealBricks('bricks-base2',0), 300);
  }, 2400);

  T(()=>{
    setPhase('Estrutura Central','9×9 cm · Altura 6cm',52,'Erguendo estrutura central...');
    document.getElementById('sec-central').style.height='136px';
    document.getElementById('sp-central').classList.add('active');
    T(()=>{
      revealBricks('bricks-central',0);
      T(()=>document.getElementById('big-win').classList.add('glow'), 900);
    }, 300);
  }, 4000);

  T(()=>{
    setPhase('Topo da Torre','11×11 cm · Janelas + Antena',72,'Construindo topo...');
    document.getElementById('sec-tower-top').style.height='82px';
    document.getElementById('sp-top').classList.add('active');
    T(()=>{
      revealBricks('bricks-top',0);
      T(()=>{
        ['w1','w2','w3'].forEach((id,i)=>setTimeout(()=>document.getElementById(id).classList.add('glow'),i*150));
      }, 700);
    }, 300);
  }, 6000);

  T(()=>{
    setPhase('Antena','Transmissão instalada',86,'Instalando antena...');
    document.getElementById('ant-shaft').style.height='80px';
    T(()=>{
      document.getElementById('ant-ball').style.opacity='1';
      document.getElementById('ant-ball').style.transform='scale(1)';
    }, 700);
  }, 7800);

  T(()=>{
    setPhase('Identidade MRV','Logotipo aplicado na fachada',96,'Aplicando logo MRV...');
    document.getElementById('mrv-facade').classList.add('show');
  }, 9200);

  T(()=>{
    setPhase('Torre Concluída!','Altura mínima de 20cm atingida ✓',100,'✅ Construção finalizada!');
    document.getElementById('congrats-banner').classList.add('show');
    document.getElementById('restart-btn').style.display='inline-block';
    spawnConfetti();
    for(let i=0;i<12;i++) T(spawnFly, i*80);
  }, 10400);
}

window.addEventListener('load', ()=>{ setTimeout(startAnim, 800); });
</script>
